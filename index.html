<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Substation Tower</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Bodoni+Moda:ital,wght@0,500;1,500&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Courier+Prime:ital@0;1&amp;family=DM+Mono:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;family=Jost:wght@400;500;600&amp;family=Libre+Baskerville:ital@0;1&amp;family=Newsreader:ital,wght@0,400;0,500;1,400&amp;display=swap"><style id="site-css">
/* Layout: four pages (Home, Library, Gallery, Profile). Home shows only the latest news and latest works. Two designs share one structure: Literary (italic, waveform, record-sleeve) and Substation (the original industrial tower, condensed type, numbered plates). */
:root{
  --bg:#EEF0F2; --panel:#F8F9FA; --ink:#151B28; --mute:#5D6676; --line:#C9CED6;
  --acc:#B4325E; --accent:var(--acc);
  --f-display:'Cormorant Garamond',Georgia,serif;
  --f-body:'Newsreader',Georgia,serif;
  --f-ui:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E121A;--panel:#161B26;--ink:#E8EAEE;--mute:#98A1B1;--line:#2A3140;--accent:color-mix(in srgb,var(--acc) 65%,#fff);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E121A;--panel:#161B26;--ink:#E8EAEE;--mute:#98A1B1;--line:#2A3140;--accent:color-mix(in srgb,var(--acc) 65%,#fff);color-scheme:dark}
:root[data-design="substation"]{--bg:#E7EAE8;--panel:#F2F4F2;--ink:#16212A;--mute:#566570;--line:#B7C1C5}
@media (prefers-color-scheme:dark){
  :root[data-design="substation"]:not([data-theme="light"]){--bg:#11171C;--panel:#1A222A;--ink:#E3E9EB;--mute:#93A2AB;--line:#2E3A43;--accent:color-mix(in srgb,var(--acc) 72%,#fff)}
}
:root[data-design="substation"][data-theme="dark"]{--bg:#11171C;--panel:#1A222A;--ink:#E3E9EB;--mute:#93A2AB;--line:#2E3A43;--accent:color-mix(in srgb,var(--acc) 72%,#fff)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs,18px)/1.65 var(--f-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--wrap,1080px);margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding-block:18px}
.brand{font:500 12px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:2px 22px;align-items:center}
nav a,.lnk{font:500 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--mute);background:none;border:0;padding:6px 0;cursor:pointer}
nav a:hover,.lnk:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.hero{padding-block:clamp(40px,9vw,104px) 24px}
.hero.tw{display:grid;grid-template-columns:var(--gc,minmax(0,1.5fr) minmax(0,1fr));gap:32px;align-items:end}
.roles{font:500 12px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 18px}
h1.name{font:italic 500 clamp(56px,13vw,176px)/.88 var(--f-display);letter-spacing:-.02em;margin:0 0 24px;text-wrap:balance;overflow-wrap:break-word}
.hero.tw h1.name{font-size:clamp(44px,8.5vw,128px)}
h1.name.pg{font-size:clamp(44px,9vw,112px)}
.tag{font:italic 400 clamp(20px,2.6vw,28px)/1.35 var(--f-display);color:var(--mute);max-width:30ch;margin:0}
.wave{display:block;width:100%;height:72px;margin-top:40px;color:var(--accent)}
.art{color:var(--ink);justify-self:end;width:min(100%,240px)}
.art svg{display:block;width:100%;height:auto}
.art .w{stroke:var(--accent)}
.sec{padding-block:44px 8px}
.sechead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;justify-content:space-between;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:12px}
.sec h2,.lab{font:500 12px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;margin:0}
.sechead a.more,.more{font:500 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-decoration:none}
.sechead a.more:hover{text-decoration:underline}
.chips,.seg,.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--line);background:none;cursor:pointer;border-radius:99px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plate{font:500 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0}
.plate b{color:var(--accent);font-weight:500}
.ixl{display:flex;flex-direction:column}
.ix{display:grid;grid-template-columns:3.2ch minmax(0,1fr) auto auto;gap:4px 20px;align-items:baseline;padding-block:16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.ix:hover .ti{color:var(--accent)}
.ix .no{font:400 12px var(--f-ui);color:var(--mute)}
.ix .ti{font:italic 500 clamp(24px,3.4vw,34px)/1.15 var(--f-display);overflow-wrap:anywhere}
.ix .ti small{display:block;font:400 15px/1.45 var(--f-body);font-style:normal;color:var(--mute);margin-top:2px}
.ix .ty,.ix .yr{font:500 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ix.draft{opacity:.7}
.ix.draft .ti{text-decoration:underline dashed var(--line);text-underline-offset:6px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:28px 20px}
.cc{text-decoration:none;color:inherit;min-width:0;display:flex;flex-direction:column;gap:10px}
.cc .im{aspect-ratio:1/1;max-width:100%;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.cc .im img{width:100%;height:100%;object-fit:contain;display:block;background:var(--panel)}
.cc .im span{font:italic 500 64px var(--f-display);color:var(--line)}
.cc .im q{quotes:none;display:block;padding:18px;text-align:center;font:italic 400 19px/1.4 var(--f-display);color:var(--mute);overflow-wrap:anywhere}
.cc h3{font:italic 500 26px/1.15 var(--f-display);margin:0;overflow-wrap:anywhere}
.cc p.sum{margin:4px 0 0;color:var(--mute);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.cc:hover h3{color:var(--accent)}
.cc.draft .im{border-style:dashed}
.news{display:flex;flex-direction:column}
.nw{display:grid;grid-template-columns:9em minmax(0,1fr);gap:4px 24px;padding-block:18px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.nw:hover h3{color:var(--accent)}
.nw time{font:500 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:7px}
.nw h3{font:italic 500 clamp(24px,3.2vw,32px)/1.15 var(--f-display);margin:0 0 4px;overflow-wrap:anywhere}
.nw p{margin:0;color:var(--mute);font-size:16px;overflow-wrap:anywhere}
.nw.draft{opacity:.7}
.empty{border:1px dashed var(--line);padding:36px 24px;color:var(--mute);font-size:17px}
.empty strong{display:block;color:var(--ink);font:italic 500 32px var(--f-display);margin-bottom:6px}
.btn{font:500 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;padding:11px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-block;border-radius:99px}
.btn.ghost{background:none;color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.sm{padding:7px 12px}
.detail{padding-block:28px 24px}
.detail .hd{max-width:36em;margin:0 auto}
.detail.wide .hd{max-width:none}
.detail h1{font:italic 500 clamp(40px,7vw,88px)/1 var(--f-display);margin:12px 0 18px;overflow-wrap:anywhere;text-wrap:balance}
.detail .lede{font:italic 400 22px/1.4 var(--f-display);color:var(--mute);margin:0 0 8px}
.hdimg{display:block;width:100%;max-height:520px;object-fit:contain;background:var(--panel);border:1px solid var(--line);margin:28px 0}
.verse{white-space:pre-wrap;font-size:clamp(19px,2.4vw,22px);line-height:1.8;margin:36px auto 0;max-width:36em;overflow-wrap:anywhere}
.prose p{margin:0 0 1.1em;max-width:36em;overflow-wrap:anywhere}
.sleeve{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,5vw,64px);align-items:start;margin-top:12px}
.sleeve img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--panel);border:1px solid var(--line)}
.act{margin:32px auto 0;max-width:36em}
.wl{margin:36px auto 0;max-width:36em}
.wl h2{font:500 12px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.wl ol{list-style:none;margin:0;padding:0}
.wl li{display:grid;grid-template-columns:3.2ch minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;padding-block:11px;border-bottom:1px solid var(--line)}
.wl .no{font:400 12px var(--f-ui);color:var(--mute)}
.wl .tt{overflow-wrap:anywhere}
.wl .nt{font:500 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:right}
.wl li.wh{display:block;padding-block:22px 8px;border-bottom:2px solid var(--line)}
.wl li.wh .tt{font:500 12px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.pn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:56px;border-top:1px solid var(--line);padding-top:20px}
.pn a{text-decoration:none;display:flex;flex-direction:column;gap:2px;min-width:0}
.pn a:last-child{text-align:right;align-items:flex-end}
.pn span.t{font:italic 500 24px/1.2 var(--f-display);overflow-wrap:anywhere}
.pn a:hover .t{color:var(--accent)}
.gal{columns:3 260px;column-gap:18px}
.gi{break-inside:avoid;margin:0 0 18px}
.gi button{display:block;width:100%;padding:0;border:1px solid var(--line);background:var(--panel);cursor:zoom-in}
.gi img{display:block;width:100%;height:auto}
.gi figcaption{padding-top:8px;font-size:15px;line-height:1.4;color:var(--mute);overflow-wrap:anywhere}
.gi figcaption b{display:block;font:500 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:500}
.lb{position:fixed;inset:0;z-index:60;background:rgba(8,10,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#fff}
.lb img{max-width:100%;max-height:calc(100vh - 190px);object-fit:contain;display:block}
.lb p{margin:0;font-size:16px;text-align:center;max-width:40em;color:#E5E7EC}
.lb p a{color:#fff}
.lb .row{justify-content:center}
.lb .btn{background:none;color:#fff;border-color:#fff}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.prof{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:start;padding-block:12px 24px}
.prof.nophoto{grid-template-columns:minmax(0,1fr)}
.prof .ph0{width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);display:block}
.prof .hl{font:italic 400 clamp(22px,3vw,30px)/1.35 var(--f-display);color:var(--mute);margin:0 0 20px}
.prof .bio p{margin:0 0 1.1em;max-width:36em;overflow-wrap:anywhere}
.facts,.contact{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 28px;margin:0}
.facts dt,.contact dt{font:500 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-top:5px}
.facts dd,.contact dd{margin:0;overflow-wrap:anywhere}
.sub{margin-top:36px}
.sub h2{font:500 12px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
footer.foot{margin-top:56px;padding-block:24px 48px;border-top:1px solid var(--line);color:var(--mute);font:400 12px var(--f-ui);letter-spacing:.06em}
.soc{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:12px}
.soc a{text-decoration:none;font:500 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.soc a:hover{color:var(--accent)}
.burger{display:none;width:42px;height:42px;border:1px solid var(--line);background:none;cursor:pointer;align-items:center;justify-content:center;padding:0}
.burger span,.burger span::before,.burger span::after{display:block;width:18px;height:2px;background:var(--ink);content:"";position:relative}
.burger span::before{position:absolute;top:-6px}
.burger span::after{position:absolute;top:6px}
.fh{background:var(--panel);border:1px solid var(--line);margin-top:8px}
.fhi{display:grid;grid-template-columns:var(--gc,minmax(0,5fr) minmax(0,6fr));gap:clamp(20px,5vw,56px);align-items:center;padding:clamp(20px,4vw,48px)}
.fcov img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--panel);border:1px solid var(--line)}
.fcov .art{width:min(100%,260px);margin:0 auto;justify-self:auto}
h1.name.fn{font-size:clamp(36px,6vw,78px);line-height:.98;margin-bottom:16px}
.fh .roles{margin-bottom:14px}
.fw{padding:0 clamp(20px,4vw,48px) 16px}
.fw .wave{margin:0;height:56px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:26px 20px}
.vc{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;min-width:0}
.vp{aspect-ratio:16/9;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:34px;border:1px solid var(--line)}
.vc:hover .vp{background:var(--accent);color:#fff}
.vc h3{font:italic 500 24px/1.15 var(--f-display);margin:0;overflow-wrap:anywhere}
.vc p{margin:0;color:var(--mute);font-size:15px;overflow-wrap:anywhere}
.ev{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:8px 20px;align-items:center;padding-block:16px;border-bottom:1px solid var(--line)}
.ev.draft{opacity:.7}
.ed{text-align:center;border:1px solid var(--line);padding:8px 4px}
.ed b{display:block;font:italic 500 34px/1 var(--f-display)}
.ed span.et{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--ink)}
.ed span{font:500 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ev h3{font:italic 500 26px/1.15 var(--f-display);margin:0;overflow-wrap:anywhere}
.ev p{margin:2px 0 0;color:var(--mute);overflow-wrap:anywhere}
[data-design="substation"] :is(.vc h3,.ev h3,.ed b){font-style:normal}
@media (max-width:760px){.fhi{grid-template-columns:minmax(0,1fr)}.fcov img{max-width:320px}.burger{display:inline-flex}.top nav{display:none;width:100%;flex-direction:column;align-items:flex-start;padding-block:6px}.top nav.open{display:flex}}
@media (max-width:560px){.ev{grid-template-columns:4.5em minmax(0,1fr)}.ev>:last-child{grid-column:2;justify-self:start}}
/* Substation design: the original industrial look */
[data-design="substation"] h1.name{font-style:normal;font-weight:700;text-transform:uppercase;letter-spacing:0;line-height:.92}
[data-design="substation"] :is(.tag,.lede,.hl,.detail h1,.ix .ti,.cc h3,.nw h3,.pn span.t,.empty strong){font-style:normal}
[data-design="substation"] :is(.chip,.btn,.pill){border-radius:0}
[data-design="substation"] .ix .ti,[data-design="substation"] .cc h3,[data-design="substation"] .nw h3{font-weight:600}
[data-design="substation"] .cc .im span,[data-design="substation"] .cc .im q{font-style:normal}
[data-design="substation"] .verse{font-size:clamp(17px,2.1vw,20px)}
[data-design="stage"] h1.name,[data-font="stage"] h1.name{font-style:normal;letter-spacing:-.03em;line-height:.95}
[data-font="typewriter"] h1.name{font-style:normal;font-weight:700;letter-spacing:-.04em;line-height:1}

.tsep{border:0;border-top:2px solid var(--ink);margin:6px 0 26px}
.trk .tg.ly{border-color:var(--line);color:var(--mute)}

/* Tower placeholder */
.tph{display:block;width:46%;max-width:190px;color:var(--tw,var(--mute))}
.tph svg{display:block;width:100%;height:auto}
.tph .w{stroke:var(--tww,var(--accent))}
.nci{aspect-ratio:16/10;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.tile .tph{position:absolute;right:8%;top:12%;width:26%;color:var(--bg);opacity:.35}
.tile .tph .w{stroke:currentColor}
.cc .im .tph,.pci .tph,.nci .tph{margin:0 auto}
.hexrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center}
.hexrow input[type=text]{font:500 14px var(--f-ui);text-transform:uppercase;letter-spacing:.06em}
/* Shop */
.pbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;text-align:center;background:var(--ink);color:var(--bg);padding:12px 18px;font:500 13px var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.pbar .cd{font-variant-numeric:tabular-nums;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);padding:3px 10px}
.pbar .btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.sbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.sbar input[type=search],.sbar select{font:400 15px var(--f-body);background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:0;min-width:0}
.sbar input[type=search]{flex:1 1 240px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:34px 22px}
.fc.pgrid,.fc.tiles{grid-template-columns:repeat(var(--c),minmax(0,1fr))}
.pc{display:flex;flex-direction:column;gap:12px;min-width:0;text-align:center}
.pc.draft{opacity:.7}
.pci{position:relative;display:grid;place-items:center;aspect-ratio:1/1;background:var(--panel);border:1px solid var(--line);overflow:hidden;text-decoration:none}
.pci img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.pci:hover img{transform:scale(1.04)}
.pci span{font:italic 500 64px var(--f-display);color:var(--line)}
.pbg{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font:500 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:3px 9px}
.pbg.so{background:var(--ink);color:var(--bg)}
.pct h3{font:italic 500 24px/1.15 var(--f-display);margin:2px 0 4px;overflow-wrap:anywhere}
.pct h3 a{text-decoration:none}
.pct h3 a:hover{color:var(--accent)}
.pp{margin:0 0 10px;font:500 15px var(--f-ui)}
.pp s{color:var(--mute);margin-right:6px}
.pp b{color:var(--accent);font-weight:500}
.pc .row{gap:8px 16px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.tile{position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:var(--ink);color:var(--bg);overflow:hidden;cursor:pointer;display:grid;place-items:end start;padding:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transition:opacity .2s}
.tile:hover img{opacity:.8}
.tile span{position:relative;font:italic 500 28px/1.1 var(--f-display);padding:14px}
@media (max-width:700px){.fc.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fc.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.fc.pgrid{grid-template-columns:minmax(0,1fr)}}
[data-design="substation"] :is(.pct h3,.tile span,.pci span){font-style:normal}
/* Custom sections and look controls */

prisingly, time flew faster than we could ever thought.\n\nFollowing months of encrypted radio telemetry, static-laden social leaks, and mysterious wheatpaste schematics appearing across major industrial corridors, SIGNAL:CUSP officially announces their highly anticipated studio album: Substation Tower.\n\nScheduled for worldwide transmission on October 30, 2026 via Analog Resonance Collective, the 12-track project marks a definitive shift for the artist into the realm of electro-industrial darkwave, post-industrial shoegaze, and cyber-folklore\n\nRecorded using a blend of modular Eurorack rigs, vintage tape loops, and raw field recordings captured directly underneath active high-voltage power lines, Substation Tower explores modern technological isolation, grid dependency, and the ghost-like frequencies embedded within municipal infrastructure.\n\n\"We live inside a massive, hummable cage,\" explains SIGNAL:CUSP. \"Every high-tension cable, every porcelain insulator, and every transformer box is vibrating at a constant 60Hz frequency. If you climb high enough—or listen closely enough—you realize the grid is holding onto decades of discarded telephone calls, ambient urban noise, and collective human anxiety.\"\n\nAcross its 52-minute runtime, Substation Tower moves seamlessly between crushing industrial percussion (\"Arc Flash\"), haunting vocal-processed synth-pop (\"Ghost in the Insulator\"), and sprawling, atmospheric soundscapes (\"Gridlock Symphony\").","link":"","img":"1a226ea70e40daa4dfdfbb6305e6eac2","listTitle":"Tracklist","items":[{"title":"Standard Edition","note":"","head":true},{"title":"Love Crashout","note":""},{"title":"Kluang","note":""},{"title":"Blue Filter","note":""},{"title":"Static Prayer","note":""},{"title":"You Look Like Someone I Knew","note":""},{"title":"The Door at the End of the Hall","note":""},{"title":"Wildfire","note":""},{"title":"196hz","note":""},{"title":"I Don't Live There Anymore","note":""},{"title":"Last Witness","note":""} function parseTracks(text){
  var out=[],TM=/^\d{1,2}:\d{2}(?::\d{2})?$/;
  String(text||'').split(/\r?\n/).forEach(function(raw){
    var l=raw.replace(/[\u00a0\u200b]/g,' ').trim();if(!l)return;
    var h=/^#+\s*(.*)$/.exec(l)||/^\[(.+)\]$/.exec(l)||(l.indexOf('|')<0&&/^(.{1,60}):$/.exec(l));
    if(h){if(h[1].trim())out.push({title:h[1].trim(),note:'',head:true});return}
    l=l.replace(/^(?:track\s*)?\d{1,3}\s*[.):\-\u2013]\s+/i,'').replace(/^[-*\u2022]\s+/,'');
    var f;
    if(/[|\t]/.test(l))f=l.split(/\s*[|\t]\s*/).map(function(x){return x.trim()});
    else{var m=/^(.*?)[\s\-\u2013\u2014(\[]+(\d{1,2}:\d{2}(?::\d{2})?)[)\]]?$/.exec(l);f=m&&m[1]?[m[1],m[2]]:[l]}
    var title=f[0]||'';if(!title)return;
    var rest=f.slice(1).filter(Boolean),time='',url='';
    rest=rest.filter(function(x){if(!time&&TM.test(x)){time=x;return false}if(!url&&/^https?:\/\//i.test(x)){url=x;return false}return true});
    var note=time||rest.shift()||'',tag=rest.shift()||'';
    out.push({title:title,note:note,tag:tag,url:url});
  });
  return out;
}

  msg('Uploading '+files.length+' picture'+(files.length===1?'':'s')+'…');
  var fail=0;
  for(var i=0;i<files.length;i++){
    try{var r=await rt.assets.upload(await prepImg(files[i]));S.gallery.push({id:uid(),img:r.id,caption:''})}catch(e){fail++}

}

function fileIn(el){
  if(!el||el.type!=='file'||!el.files||!el.files.length)return;
  var fl=Array.prototype.slice.call(el.files);
  if(el.dataset.imgpath){uploadTo(el.dataset.imgpath,fl[0])}else if(el.dataset.gal){uploadMany(fl)}else return;
  try{el.value=''}catch(e){}
}
